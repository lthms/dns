name: DNS
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency: dns
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_gcp_terraform_credentials: ${{ secrets.GCP_TERRAFORM_CREDENTIALS }}
      TF_VAR_ovh_client_id: ${{ secrets.OVH_CLIENT_ID }}
      TF_VAR_ovh_client_secret: ${{ secrets.OVH_CLIENT_SECRET }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform init
      - run: terraform apply -auto-approve
